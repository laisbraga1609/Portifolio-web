<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="cruzCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="250" cy="180" r="160" fill="rgba(0, 196, 230, 0.05)" />

  <!-- Tooth Icon Symbol -->
  <g transform="translate(0, 10)">
    <!-- Cyan Left Side Digital Arch -->
    <path d="M 230 60 
             C 170 30, 120 70, 120 140 
             C 120 210, 160 300, 190 330 
             C 210 345, 220 310, 220 280 
             C 220 250, 230 250, 230 280 L 230 60 Z" 
          fill="none" stroke="url(#cruzCyanGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Digital Tech Circuit Lines & Nodes inside left tooth -->
    <path d="M 140 140 L 195 140 M 140 180 L 175 180 L 195 200 M 165 100 L 195 130" 
          stroke="#00c4e6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="140" r="6" fill="#00e5ff"/>
    <circle cx="140" cy="180" r="6" fill="#00e5ff"/>
    <circle cx="165" cy="100" r="6" fill="#00e5ff"/>

    <!-- Dark/White Right Side Arch -->
    <path d="M 230 60 
             C 290 30, 340 70, 340 140 
             C 340 210, 300 300, 270 330 
             C 250 345, 240 310, 240 280 
             C 240 250, 230 250, 230 280 L 230 60 Z" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cross & +3 Badge Symbol in Center Right -->
    <g transform="translate(265, 140)">
      <!-- Cross Icon -->
      <path d="M 0 -15 L 0 15 M -15 0 L 15 0" stroke="#00c4e6" stroke-width="8" stroke-linecap="round"/>
      <!-- Number 3 -->
      <text x="32" y="14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="900" fill="#00c4e6">3</text>
    </g>
  </g>

  <!-- Typography: CRUZ 3 DESIGN -->
  <g transform="translate(250, 420)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="2">
      <tspan fill="#ffffff">CRUZ</tspan><tspan fill="#00c4e6">3</tspan><tspan fill="#ffffff">DESIGN</tspan>
    </text>
    <text y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="3.5">
      PRÓTESE DENTÁRIA DIGITAL • ESTÉTICA • INOVAÇÃO
    </text>
  </g>
</svg>
